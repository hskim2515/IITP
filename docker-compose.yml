version: '3'
services:
  postgres:
    image: gaia3d/iitp-db:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iitp
    volumes:
      - ./database:/database:ro
      - ./database/restore.sh:/docker-entrypoint-initdb.d/init-user-db.sh:ro
    ports:
      - "5432:5432"