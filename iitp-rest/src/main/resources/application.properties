spring.application.name=iitp-rest
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url= jdbc:postgresql://localhost:5432/iitp
spring.datasource.username= postgres
spring.datasource.password= postgres

logging.level.root=INFO

# 로컬: 로컬 파일시스템 저장 + Spring 내장 서버 제공
storage.type=local
iitp.local.data-path=${user.home}/.iitp-local/models
database.vehicle_sim.remoteUrl=http://localhost:9090/local-data/models/

# sftp (develop 프로파일에서 활성화)
#sftp.host=175.197.92.213
#sftp.port=10208
#sftp.user=gaia3d
#sftp.password=gaia3d
#sftp.base-path=/home/gaia3d/iitp/data/models/

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=true
spring.jpa.hibernate.database=postgresql

# debugging - jpa n+1 problem
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# logging.level.org.hibernate.SQL=DEBUG

# optimize db access
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

server.port=9090

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# SUMO netconvert via Docker
# docker pull ghcr.io/eclipse-sumo/sumo:latest
sumo.docker.image=ghcr.io/eclipse-sumo/sumo:latest
sumo.docker.temp-dir=/tmp
sumo.netconvert.timeout-seconds=120
