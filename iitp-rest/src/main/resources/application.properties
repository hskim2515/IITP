spring.application.name=iitp-rest
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url= jdbc:postgresql://localhost:5432/iitp
spring.datasource.username= postgres
spring.datasource.password= postgres

logging.level.root=INFO

# 로컬: 로컬 파일시스템 저장 + Spring 내장 서버 제공
storage.type=local
iitp.local.data-path=${user.home}/.iitp-local/models
database.vehicle_sim.remoteUrl=http://localhost:9090/local-data/models/

# sftp (develop 프로파일에서 활성화)
#sftp.host=175.197.92.213
#sftp.port=10208
#sftp.user=gaia3d
#sftp.password=gaia3d
#sftp.base-path=/home/gaia3d/iitp/data/models/

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=true
spring.jpa.hibernate.database=postgresql

# debugging - jpa n+1 problem
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# logging.level.org.hibernate.SQL=DEBUG

# optimize db access
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

server.port=9090

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# SUMO netconvert via Docker
# docker pull ghcr.io/eclipse-sumo/sumo:latest
sumo.docker.image=ghcr.io/eclipse-sumo/sumo:latest
sumo.docker.temp-dir=/tmp
sumo.netconvert.timeout-seconds=120

# NextSim (KAIST 교통 시뮬레이터) — 배포판 경로 설정 시 /simulation API 활성화
# 실행 모드:
#   docker (기본) — Ubuntu 22.04 x86_64 바이너리를 Docker(linux/amd64)로 실행. mac 개발기용
#                   (에뮬레이션이라 대규모 네트워크는 매우 느림 — 수도권 route-gen 77분+ 실측)
#   native        — 바이너리 직접 실행. Linux x86_64 서버 전용, 에뮬레이션 오버헤드 없음.
#                   서버 배포 시: nextsim.execution-mode=native + nextsim.home=서버 배포판 경로
#                   (최초 1회 chmod +x {home}/Captain/build/bin/* 필요)
nextsim.home=/Users/hskim/Downloads/nextsim-linux-x64-v1.0
nextsim.execution-mode=docker
nextsim.docker.image=ubuntu:22.04
nextsim.docker.platform=linux/amd64
nextsim.timeout-seconds=3600

# KTDB 링크 종단경사(section) 계산용 지형(DEM) — 표준노드링크 원본엔 경사 필드가 없어
# 별도 DEM(GeoTIFF)에서 계산해야 함(ogrinfo로 MOCT_LINK.shp 전체 속성 확인 — 경사 필드 없음).
# gdallocationinfo CLI를 배치 호출(-wgs84 -valonly, stdin에 lon/lat 여러 줄)하는 방식이라
# 서버에 GDAL이 설치돼 있어야 하고, 파일은 반드시 타일링+오버뷰가 돼 있어야 함(실측:
# 행 단위 원본은 5000점 조회에 수 분, gdal_translate -co TILED=YES ... + gdaladdo 적용 후
# 같은 조회가 0.092초 — 1000배 이상 차이). 비어있으면(로컬 개발 등) 기능 전체를 조용히
# 스킵 — section 없이 기존과 동일하게 동작.
ktdb.dem.path=
ktdb.dem.sample-interval-m=10
ktdb.dem.slope-merge-threshold=1.5
# 경사 계산 전 이동평균 윈도우(샘플 개수, 10m 간격 기준 5=50m) — 실측(부천 실링크, 1m DEM):
# 스무딩 없이는 연석/가로수 등 표면 잡음으로 ±50~65% 비현실적 경사 스파이크가 남.
ktdb.dem.smoothing-window-samples=5
