# KTDB 링크 종단경사 계산용 DEM — gdal_translate -co TILED=YES -co BLOCKXSIZE=256
# -co BLOCKYSIZE=256 -co COMPRESS=DEFLATE + gdaladdo 로 재타일링한 파일 경로로 주석 해제
# (원본 행 단위 GeoTIFF는 임의 지점 조회가 1000배 이상 느려 반드시 재타일링본을 써야 함)
