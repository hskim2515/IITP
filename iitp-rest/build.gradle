plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.iitp'
version = '0.0.1-SNAPSHOT'

// BOM 관리 버전 보안 오버라이드 (OSV 기준 잔여 moderate 해소)
ext['jackson-bom.version'] = '2.21.5'
ext['commons-lang3.version'] = '3.18.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(23)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation("org.springframework.boot:spring-boot-starter-web") // 🚀 웹 기능 추가!

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.hibernate.orm:hibernate-core:6.2.7.Final'
	runtimeOnly 'org.postgresql:postgresql'

	// JSON 직렬화/역직렬화 (Jackson)
    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.json:json:20240303'
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml"
    implementation "com.fasterxml.jackson.module:jackson-module-jakarta-xmlbind-annotations"

	// Cesium 관련 계산이 필요한 경우 (JTS 지리 정보 라이브러리)
	implementation("org.locationtech.jts:jts-core:1.18.2")

	// Lombok (선택 사항, 코드 간결화)
	compileOnly("org.projectlombok:lombok")
	annotationProcessor("org.projectlombok:lombok")

	// 테스트 라이브러리
	testImplementation("org.springframework.boot:spring-boot-starter-test")

	// Log4j2
	implementation 'org.apache.logging.log4j:log4j-core:2.26.1'
	implementation 'org.apache.logging.log4j:log4j-api:2.26.1'

	// Proj4J (좌표 변환)
	implementation 'org.locationtech.proj4j:proj4j:1.1.0'

	implementation 'org.xerial:sqlite-jdbc:3.53.2.0'  // SQLite JDBC 의존성 추가
	implementation 'com.jcraft:jsch:0.1.55'

	implementation("org.glassfish.jaxb:jaxb-runtime:4.0.5") // StAX

	implementation 'com.vladmihalcea:hibernate-types-60:2.21.1'

	implementation 'org.apache.commons:commons-math3:3.6.1'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

}

test {
    useJUnitPlatform()
    maxHeapSize = "2g"
}

// ⚠️ 실측(배포서버): Spring Boot Gradle 플러그인은 기본적으로 bootJar(의존성 전부 번들된
// 실행 가능 fat jar)와 jar(컴파일된 클래스만 있는 thin jar, "-plain" 접미사) 둘 다 만든다.
// Dockerfile의 `ADD ./build/libs/*.jar app.jar`는 build/libs/에 매치되는 파일이 둘이라
// 어느 쪽이 최종 app.jar가 될지 모호한데, 실제로 thin(-plain) jar가 배포된 적이 있었다 —
// 그 결과 jaxb-runtime 등 implementation 의존성이 클래스패스에서 통째로 빠져
// "Implementation of Jakarta XML Binding-API has not been found on module path or classpath"
// 같은 예외가 배포서버에서만(로컬 IntelliJ 실행은 풀 클래스패스라 재현 안 됨) 발생했다.
// thin jar 생성을 아예 꺼서 build/libs/에 fat jar 하나만 남긴다 — Dockerfile의 와일드카드가
// 항상 올바른 jar를 가리키도록 근본적으로 모호성을 제거.
tasks.named('jar') {
    enabled = false
}