name: IITP REST CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  backend-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout-source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 22
        uses: actions/setup-java@v3
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew
        working-directory: ./iitp-rest

      - name: Build with gradle
        run: ./gradlew clean build -x test
        working-directory: ./iitp-rest

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build --build-arg SPRING_PROFILES_ACTIVE=stage -t ${{ secrets.DOCKER_USERNAME }}/iitp-rest:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/iitp-rest:latest

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Run remote script with password authentication
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '/home/gaia3d/iitp/restart.sh'
