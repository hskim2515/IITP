
name: IITP FRONT CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./iitp-front
          file: ./iitp-front/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/iitp-front:latest

      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew
        working-directory: ./iitp-rest

      - name: Build with gradle
        run: ./gradlew clean build -x test
        working-directory: ./iitp-rest

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./iitp-rest
          file: ./iitp-rest/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/iitp-rest:latest
          build-args: |
            SPRING_PROFILES_ACTIVE=stage

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Run remote script with password authentication
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '/home/gaia3d/iitp/restart.sh'

