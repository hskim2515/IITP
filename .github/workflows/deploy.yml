
name: IITP FRONT CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./iitp-front
          file: ./iitp-front/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/iitp-front:latest

      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew
        working-directory: ./iitp-rest

      - name: Build with gradle
        run: ./gradlew clean build -x test
        working-directory: ./iitp-rest

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./iitp-rest
          file: ./iitp-rest/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/iitp-rest:latest
          build-args: |
            SPRING_PROFILES_ACTIVE=develop

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Upload config files to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'mkdir -p /home/gaia3d/iitp/database'
          envsubst '${DOCKER_USERNAME}' < docker-compose.prod.yml > /tmp/docker-compose.yml
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -P "$SSH_PORT" \
            /tmp/docker-compose.yml "$SSH_USER@$SSH_HOST:/home/gaia3d/iitp/docker-compose.yml"
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -P "$SSH_PORT" \
            database/sync_tables.sql "$SSH_USER@$SSH_HOST:/home/gaia3d/iitp/database/"

      - name: Deploy on server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            cd /home/gaia3d/iitp
            docker compose pull
            docker compose down --remove-orphans
            fuser -k 48080/tcp 2>/dev/null || true
            fuser -k 49090/tcp 2>/dev/null || true
            docker container prune -f
            docker compose up -d
          '

      - name: Sync DB tables (menu, layer_schema_config)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /home/gaia3d/iitp &&
             timeout 60 bash -c "until docker compose exec -T postgres pg_isready -U postgres; do sleep 2; done" &&
             timeout 120 bash -c "until docker compose exec -T postgres psql -U postgres -d iitp -c \"SELECT 1 FROM menu LIMIT 1\" > /dev/null 2>&1; do sleep 5; done" &&
             docker compose exec -T postgres psql -U postgres -d iitp -f /database/sync_tables.sql'

