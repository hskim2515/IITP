services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iitp
    volumes:
      - ./database:/database:ro
      - ./database/restore.sh:/docker-entrypoint-initdb.d/init-user-db.sh:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "45432:5432"
    restart: unless-stopped

  front:
    image: ${DOCKER_USERNAME}/iitp-front:latest
    ports:
      - "48080:8080"
    restart: unless-stopped

  rest:
    image: ${DOCKER_USERNAME}/iitp-rest:latest
    ports:
      - "49090:9090"
    restart: unless-stopped
    depends_on:
      - postgres
    # NextSim: rest 컨테이너(Ubuntu jammy = 바이너리 빌드 환경) 안에서 native 실행.
    # 컨테이너 안에서 docker run 을 부르는 방식(-v 경로가 호스트 기준 해석)은 쓰지 않는다.
    # 배포판 위치: 개발서버에 이미 /home/gaia3d/iitp/nextsim 으로 배치되어 있음
    # (다른 서버로 옮기면 이 호스트 경로만 그 위치로 수정. chmod +x Captain/build/bin/* 1회)
    volumes:
      - /home/gaia3d/iitp/nextsim:/opt/nextsim:ro
      - nextsim_runs:/var/nextsim-runs   # 실행 워크스페이스 + 경로 캐시(Route.json) 영속화
    environment:
      NEXTSIM_HOME: /opt/nextsim
      NEXTSIM_EXECUTION_MODE: native
      NEXTSIM_WORKSPACE: /var/nextsim-runs
      NEXTSIM_TIMEOUT_SECONDS: "7200"

volumes:
  postgres_data:
  nextsim_runs:
